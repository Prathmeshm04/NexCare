<div class="registration-container">
  <div class="registration-image">
    <img src="assets/images/signup.png" alt="Healthcare Illustration" />
  </div>
  <div class="registration-form">
    <h1>User Registration</h1>
    <a href="/login" class="already-registered-link">Already Registered? Login</a>
    <form #registrationForm="ngForm" (ngSubmit)="save()">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" [(ngModel)]="username" name="username" required minlength="3" maxlength="50"
          class="form-control" id="name" placeholder="Enter Name">
        <div *ngIf="registrationForm.controls['username']?.touched && registrationForm.controls['username'].errors?.['required']" class="text-danger">
          Name is required.
        </div>
        <div *ngIf="registrationForm.controls['username']?.touched && registrationForm.controls['username'].errors?.['minlength']" class="text-danger">
          Name must be at least 3 characters long.
        </div>
        <div *ngIf="registrationForm.controls['username']?.touched && registrationForm.controls['username'].errors?.['maxlength']" class="text-danger">
          Name cannot exceed 50 characters.
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" [(ngModel)]="email" name="email" required pattern="[a-z0-9._%+-]+@gmail\.com"
          class="form-control" id="email" placeholder="Enter Email">
        <div *ngIf="registrationForm.controls['email']?.touched && registrationForm.controls['email'].errors?.['required']" class="text-danger">
          Email is required.
        </div>
        <div *ngIf="registrationForm.controls['email']?.touched && registrationForm.controls['email'].errors?.['pattern']" class="text-danger">
          Invalid email format.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" [(ngModel)]="password" name="password" required minlength="6" maxlength="20"
          class="form-control" id="password" placeholder="Enter Password">
        <div *ngIf="registrationForm.controls['password']?.touched && registrationForm.controls['password'].errors?.['required']" class="text-danger">
          Password is required.
        </div>
        <div *ngIf="registrationForm.controls['password']?.touched && registrationForm.controls['password'].errors?.['minlength']" class="text-danger">
          Password must be at least 6 characters long.
        </div>
      </div>

      <div class="form-group">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" class="form-control" [(ngModel)]="dob" [ngModelOptions]="{standalone:true}" id="dob" placeholder="Enter Date of Birth">
      </div>

      <button type="submit" [disabled]="registrationForm.invalid" class="btn btn-primary btn-block">Register</button>
    </form>
  </div>
</div>
